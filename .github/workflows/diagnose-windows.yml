name: Diagnose Windows startup

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      SRC: LED_Screen_Designer_v30_72.py
      PYTHONIOENCODING: utf-8
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.10,<7"
          pip install -r requirements.txt
          $v = pip freeze | Out-String
          $v = $v.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Output "::notice title=pip freeze::$v"

      - name: Import check (all libraries)
        shell: pwsh
        continue-on-error: true
        run: |
          $code = @'
          import importlib, traceback
          mods = ["tkinter","tkinter.ttk","sqlite3","multiprocessing","PIL","PIL.Image","PIL.ImageTk","PIL.ImageDraw","PIL.ImageFont",
                  "fitz","numpy","openpyxl","xlrd","tkinterdnd2","win32com.client","pythoncom","pywintypes","paddleocr"]
          bad = []
          for m in mods:
              try:
                  mod = importlib.import_module(m)
                  print("OK  ", m, getattr(mod, "__version__", ""))
              except BaseException as e:
                  bad.append(m)
                  print("FAIL", m, type(e).__name__, str(e)[:300])
          print("FAILED:", bad)
          '@
          Set-Content -Path check_imports.py -Value $code -Encoding utf8
          $out = python check_imports.py 2>&1 | Out-String
          Write-Output $out
          $m = $out.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Output "::warning title=Import check::$m"

      - name: Run source with python (45 s)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process python -ArgumentList '-X','faulthandler',$env:SRC -RedirectStandardError py_err.txt -RedirectStandardOutput py_out.txt -PassThru
          Start-Sleep 45
          $alive = -not $p.HasExited
          if ($alive) { $state = "ALIVE after 45s, title=[" + (Get-Process -Id $p.Id).MainWindowTitle + "]"; Stop-Process -Id $p.Id -Force } else { $state = "EXITED code=" + $p.ExitCode }
          $txt = "$state`n--- stderr ---`n" + ((Get-Content py_err.txt -Tail 80 -ErrorAction SilentlyContinue) -join "`n") + "`n--- stdout ---`n" + ((Get-Content py_out.txt -Tail 30 -ErrorAction SilentlyContinue) -join "`n")
          Write-Output $txt
          $m = $txt.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Output "::warning title=Source run::$m"

      - name: Build windowed + console exe
        shell: pwsh
        run: |
          $common = @('--noconfirm','--onedir','--icon','app.ico',
            '--collect-all','tkinterdnd2','--collect-all','fitz','--collect-all','PIL',
            '--hidden-import','PIL.ImageTk','--hidden-import','PIL.ImageOps','--hidden-import','PIL._tkinter_finder',
            '--hidden-import','win32com.client','--hidden-import','pythoncom','--hidden-import','pywintypes')
          pyinstaller --clean --windowed --name LED_WIN @common $env:SRC
          pyinstaller --console --name LED_CON @common $env:SRC
          foreach ($n in 'LED_WIN','LED_CON') {
            $w = Get-Content "build\$n\warn-$n.txt" -ErrorAction SilentlyContinue | Select-String -Pattern 'missing module named (tkinter|PIL|fitz|numpy|openpyxl|xlrd|tkinterdnd2|win32com|pythoncom|pywintypes|sqlite3|_tkinter)' | Out-String
            if ($w) { $m = $w.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'); Write-Output "::warning title=$n missing modules::$m" }
          }

      - name: Run console exe (45 s)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process "dist\LED_CON\LED_CON.exe" -RedirectStandardError con_err.txt -RedirectStandardOutput con_out.txt -PassThru
          Start-Sleep 45
          if (-not $p.HasExited) { $state = "ALIVE after 45s"; Stop-Process -Id $p.Id -Force } else { $state = "EXITED code=" + $p.ExitCode }
          $txt = "$state`n--- stderr ---`n" + ((Get-Content con_err.txt -Tail 80 -ErrorAction SilentlyContinue) -join "`n") + "`n--- stdout ---`n" + ((Get-Content con_out.txt -Tail 30 -ErrorAction SilentlyContinue) -join "`n")
          Write-Output $txt
          $m = $txt.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Output "::warning title=Console exe run::$m"

      - name: Run windowed exe (45 s)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process "dist\LED_WIN\LED_WIN.exe" -PassThru
          Start-Sleep 45
          if (-not $p.HasExited) {
            $wins = Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" } | Out-String
            $state = "ALIVE after 45s. Windows:`n$wins"; Stop-Process -Id $p.Id -Force
          } else { $state = "EXITED code=" + $p.ExitCode }
          Write-Output $state
          $m = $state.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Output "::warning title=Windowed exe run::$m"
