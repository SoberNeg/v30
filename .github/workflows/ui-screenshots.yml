name: UI screenshots (Windows)

on:
  workflow_dispatch:
    inputs:
      src:
        description: "Python file to test"
        default: "LED_Screen_Designer_v40_37_1.py"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run UI test (light + dark)
        shell: pwsh
        run: |
          foreach ($t in 'light','dark') {
            $p = Start-Process python -ArgumentList 'ci/ui_screenshots.py', "${{ inputs.src }}", $t, 'shots' -RedirectStandardError "err_$t.txt" -PassThru
            if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Output "::warning title=$t::timeout" }
            $e = (Get-Content "err_$t.txt" -Tail 60 -ErrorAction SilentlyContinue) -join "`n"
            if ($e) { $m = $e.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'); Write-Output "::warning title=stderr $t::$m" }
          }
          Get-ChildItem shots | ForEach-Object { Write-Output $_.Name }
      - name: Publish screenshots to branch ci-screenshots
        shell: pwsh
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          $dst = "ci-shots/${{ github.run_id }}"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item shots\* $dst
          git fetch origin ci-screenshots 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -B ci-screenshots origin/ci-screenshots } else { git checkout --orphan ci-screenshots; git rm -rfq --cached . }
          git add -f $dst
          git commit -m "UI screenshots run ${{ github.run_id }}"
          git push origin ci-screenshots
